name: release

on:
  release:
    types: [published]

permissions: {}

jobs:
  major-tag:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: move the major tag to the release
        run: |
          printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' || {
            echo "::error::$TAG is not vX.Y.Z"
            exit 1
          }
          major=${TAG%%.*}
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" \
            -f sha="$GITHUB_SHA" -F force=true ||
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$major" -f sha="$GITHUB_SHA"
